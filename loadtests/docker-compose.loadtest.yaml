# Load test overlay. Local docker-compose only, never point this at staging or
# production.
#
#   docker network create app-network            # once, app-network is external
#   docker compose -f docker-compose.yaml -f docker-compose.loadtest.yaml up -d
#   docker compose -f docker-compose.yaml -f docker-compose.loadtest.yaml \
#       run --rm seed --users 2000 --group-chats 20 --group-size 200 \
#       --supergroups 2 --supergroup-size 1200
#   docker compose -f docker-compose.yaml -f docker-compose.loadtest.yaml \
#       run --rm locust
#
# Everything talks to app/db/redis/kafka by compose service name on app-network;
# no localhost anywhere.

x-loadtest-env: &loadtest-env
  # Target under test, by service name.
  LT_API_BASE_URL: http://app:8000
  LT_WS_BASE_URL: ws://app:8000
  LT_API_PREFIX: /api/v1
  LT_DATASET_PATH: /loadtests/data/dataset.json

  # Infrastructure, by service name.
  POSTGRES_SERVER: db
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  BROKER_URL: kafka:9092

  # Scenario shaping.
  LT_TARGET_COHORT: ${LT_TARGET_COHORT:-group}
  LT_MESSAGE_SIZE_BYTES: ${LT_MESSAGE_SIZE_BYTES:-64}
  LT_SEND_WAIT_MIN_SECONDS: ${LT_SEND_WAIT_MIN_SECONDS:-0.1}
  LT_SEND_WAIT_MAX_SECONDS: ${LT_SEND_WAIT_MAX_SECONDS:-0.5}
  LT_WS_RESUME_INTERVAL_SECONDS: ${LT_WS_RESUME_INTERVAL_SECONDS:-1.0}
  LT_WS_CHURN_HOLD_SECONDS: ${LT_WS_CHURN_HOLD_SECONDS:-5.0}
  LT_TOKEN_TTL_SECONDS: ${LT_TOKEN_TTL_SECONDS:-7200}

  # Acceptance thresholds. Placeholders until the first baseline is captured;
  # override per run or from loadtests/thresholds.env.
  LT_REST_P95_MS: ${LT_REST_P95_MS:-500}
  LT_REST_P99_MS: ${LT_REST_P99_MS:-1500}
  LT_REST_ERROR_RATE: ${LT_REST_ERROR_RATE:-0.01}
  LT_DELIVERY_P95_MS: ${LT_DELIVERY_P95_MS:-2000}
  LT_DELIVERY_P99_MS: ${LT_DELIVERY_P99_MS:-5000}
  LT_WS_CONNECT_ERROR_RATE: ${LT_WS_CONNECT_ERROR_RATE:-0.02}
  LT_MIN_DELIVERY_SAMPLES: ${LT_MIN_DELIVERY_SAMPLES:-100}

services:
  seed:
    build:
      context: .
      dockerfile: loadtests/Dockerfile.loadtest
      target: loadtest
    image: social_github-loadtest
    container_name: loadtest_seed
    # JWT_SECRET_KEY / POSTGRES_* credentials come from .env; the overrides
    # above repoint the hostnames at the compose services.
    env_file:
      - .env
    environment: *loadtest-env
    volumes:
      - loadtest_data:/loadtests/data
      - ./loadtests/reports:/loadtests/reports
    entrypoint: ["python", "-m", "loadtests.seed"]
    command: ["--users", "500", "--direct-chats", "200", "--group-chats", "20",
              "--group-size", "100", "--supergroups", "2", "--supergroup-size", "1200",
              "--channels", "1", "--channel-size", "1000"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["loadtest"]
    restart: "no"
    networks:
      - app-network

  locust:
    build:
      context: .
      dockerfile: loadtests/Dockerfile.loadtest
      target: loadtest
    image: social_github-loadtest
    container_name: loadtest_locust
    env_file:
      - .env
    environment: *loadtest-env
    ports:
      # Web UI. Bound to loopback: this is a local-only tool.
      - "127.0.0.1:8089:8089"
    volumes:
      - loadtest_data:/loadtests/data
      - ./loadtests/reports:/loadtests/reports
    entrypoint: ["locust"]
    # Default run: REST throughput, headless, with an HTML + CSV report.
    # Override per scenario, e.g.
    #   run --rm locust -f loadtests/scenario_ws_fanout.py --headless -u 200 -r 20 -t 5m
    command:
      - "-f"
      - "loadtests/scenario_rest_send.py"
      - "--headless"
      - "-u"
      - "${LT_USERS:-100}"
      - "-r"
      - "${LT_SPAWN_RATE:-20}"
      - "-t"
      - "${LT_DURATION:-3m}"
      - "--html"
      - "/loadtests/reports/rest_send.html"
      - "--csv"
      - "/loadtests/reports/rest_send"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["loadtest"]
    restart: "no"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          # The load generator must not starve the system under test. Bump only
          # if locust itself becomes the bottleneck (watch CPU on this container).
          cpus: "2"
          memory: 1G

volumes:
  loadtest_data:

networks:
  app-network:
    external: true
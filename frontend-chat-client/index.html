<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social GitHub Chat Test Client</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="layout">
    <section class="card">
      <h1>Chat Test Client</h1>
      <p class="muted">Клиент для полного smoke-тестирования auth + chat API + WS.</p>

      <label>API base URL <input id="apiBaseUrl" value="http://localhost:8000/api/v1" /></label>
      <label>WS base URL <input id="wsBaseUrl" value="ws://localhost:8000/api/v1/chats/ws" /></label>

      <div class="row">
        <button id="saveConfigBtn">Сохранить</button>
        <button id="loadMeBtn">Проверить /users/me</button>
      </div>

      <hr />

      <h3>Регистрация</h3>
      <label>Username <input id="regUsername" placeholder="new_user" /></label>
      <label>Email <input id="regEmail" placeholder="new@example.com" /></label>
      <label>Password <input id="regPassword" type="password" /></label>
      <label>Repeat password <input id="regPasswordRepeat" type="password" /></label>
      <button id="registerBtn">Register</button>

      <h3>Логин</h3>
      <label>Username <input id="loginUsername" placeholder="new_user" /></label>
      <label>Password <input id="loginPassword" type="password" /></label>
      <button id="loginBtn">Login</button>

      <div class="row">
        <button id="refreshBtn">Refresh</button>
        <button id="logoutBtn">Logout</button>
      </div>

      <label>Access token <textarea id="accessToken" rows="4"></textarea></label>
    </section>

    <section class="card">
      <h2>Чаты</h2>
      <div class="row">
        <button id="loadChatsBtn">Обновить список чатов</button>
      </div>
      <ul id="chatList" class="list"></ul>

      <h3>Создать чат</h3>
      <label>Name <input id="chatName" placeholder="Test chat" /></label>
      <label>Description <input id="chatDescription" placeholder="for testing" /></label>
      <button id="createChatBtn">Create group chat</button>

      <h3>Активный чат</h3>
      <div>Chat ID: <code id="activeChatId">-</code></div>
      <div class="row">
        <button id="loadMessagesBtn">Загрузить сообщения</button>
        <button id="connectWsBtn">WS connect + subscribe</button>
      </div>
      <ul id="messageList" class="list"></ul>

      <label>Новое сообщение <input id="messageInput" placeholder="hello" /></label>
      <button id="sendMessageBtn">Send message</button>
    </section>

    <section class="card">
      <h2>Логи</h2>
      <pre id="logs"></pre>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
